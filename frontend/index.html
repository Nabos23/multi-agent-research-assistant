<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Research Assistant</title>
<style>
  :root {
    --ink: #1c1b19;
    --paper: #f4f1ea;
    --line: #d8d3c6;
    --accent: #b5512f;
    --muted: #8a8475;
    --done: #4c6b4f;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Courier New", monospace;
    display: flex;
    justify-content: center;
    padding: 48px 20px;
  }

  main {
    width: 100%;
    max-width: 640px;
  }

  h1 {
    font-size: 1.1rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    margin: 0 0 4px;
  }

  .sub {
    color: var(--muted);
    font-size: 0.85rem;
    margin: 0 0 32px;
  }

  form {
    display: flex;
    gap: 0;
    border: 1px solid var(--ink);
  }

  input[type="text"] {
    flex: 1;
    border: none;
    background: transparent;
    padding: 14px 16px;
    font-family: inherit;
    font-size: 0.95rem;
    color: var(--ink);
  }

  input[type="text"]:focus {
    outline: 2px solid var(--accent);
    outline-offset: -2px;
  }

  button {
    border: none;
    border-left: 1px solid var(--ink);
    background: var(--ink);
    color: var(--paper);
    padding: 14px 22px;
    font-family: inherit;
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    cursor: pointer;
  }

  button:disabled {
    background: var(--muted);
    cursor: not-allowed;
  }

  /* pipeline trace */
  .trace {
    margin-top: 36px;
    border-left: 1px solid var(--line);
    padding-left: 20px;
    display: none;
  }

  .trace.active { display: block; }

  .step {
    position: relative;
    padding: 4px 0 4px 0;
    font-size: 0.85rem;
    color: var(--muted);
  }

  .step::before {
    content: "";
    position: absolute;
    left: -25px;
    top: 10px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--line);
  }

  .step.live {
    color: var(--ink);
  }

  .step.live::before {
    background: var(--accent);
    box-shadow: 0 0 0 3px rgba(181, 81, 47, 0.18);
  }

  .step.complete::before {
    background: var(--done);
  }

  /* report output */
  .report {
    margin-top: 36px;
    padding-top: 24px;
    border-top: 1px solid var(--line);
    display: none;
    white-space: pre-wrap;
    font-size: 0.9rem;
    line-height: 1.6;
  }

  .report.active { display: block; }

  .report h2 {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
    margin: 0 0 16px;
  }

  .error {
    margin-top: 20px;
    color: var(--accent);
    font-size: 0.85rem;
    display: none;
  }
</style>
</head>
<body>

<main>
  <h1>Research Assistant</h1>
  <p class="sub">enter a topic — the pipeline runs, then a report</p>

  <form id="research-form">
    <input type="text" id="topic-input" placeholder="e.g. Benefits of LangGraph for AI agents" autocomplete="off" required>
    <button type="submit" id="submit-btn">Run</button>
  </form>

  <div class="trace" id="trace"></div>
  <p class="error" id="error"></p>

  <div class="report" id="report">
    <h2>Final Report</h2>
    <div id="report-text"></div>
  </div>
</main>

<script>
  const API_URL = "http://localhost:8000/api/research";

  const form = document.getElementById("research-form");
  const input = document.getElementById("topic-input");
  const submitBtn = document.getElementById("submit-btn");
  const trace = document.getElementById("trace");
  const errorBox = document.getElementById("error");
  const reportBox = document.getElementById("report");
  const reportText = document.getElementById("report-text");

  // friendly labels for each backend node/status name
  const STEP_LABELS = {
    topic_processed: "Refining topic",
    questions_generated: "Generating research questions",
    search_completed: "Searching sources",
    analysis_completed: "Analyzing findings",
    report_completed: "Writing report",
  };

  function resetUI() {
    trace.innerHTML = "";
    trace.classList.remove("active");
    reportBox.classList.remove("active");
    errorBox.style.display = "none";
    reportText.textContent = "";
  }

  function addStep(status) {
    // mark any currently-live step as complete
    const live = trace.querySelector(".step.live");
    if (live) {
      live.classList.remove("live");
      live.classList.add("complete");
    }

    const label = STEP_LABELS[status] || status;
    const el = document.createElement("div");
    el.className = "step live";
    el.textContent = label;
    trace.appendChild(el);
  }

  function finishSteps() {
    const live = trace.querySelector(".step.live");
    if (live) {
      live.classList.remove("live");
      live.classList.add("complete");
    }
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const topic = input.value.trim();
    if (!topic) return;

    resetUI();
    trace.classList.add("active");
    submitBtn.disabled = true;
    submitBtn.textContent = "Running…";

    const url = `${API_URL}?topic=${encodeURIComponent(topic)}`;
    const source = new EventSource(url);

    source.onmessage = (event) => {
      const data = JSON.parse(event.data);

      if (data.done) {
        finishSteps();
        reportText.textContent = data.report;
        reportBox.classList.add("active");
        submitBtn.disabled = false;
        submitBtn.textContent = "Run";
        source.close();
        return;
      }

      addStep(data.status);
    };

    source.onerror = () => {
      errorBox.textContent = "Connection lost — is the backend running on localhost:8000?";
      errorBox.style.display = "block";
      submitBtn.disabled = false;
      submitBtn.textContent = "Run";
      source.close();
    };
  });
</script>

</body>
</html>
